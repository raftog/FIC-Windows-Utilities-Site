name: FIC Viewer V1.2.5 VHF Driver Build

on:
  push:
    branches: [ fic-viewer-v1.2.5-build ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore WDK NuGet packages
        shell: pwsh
        working-directory: fic-viewer-v1.2.5
        run: |
          nuget restore .\packages.config -PackagesDirectory .\packages

      - name: Build unsigned FIC virtual HID driver
        shell: pwsh
        working-directory: fic-viewer-v1.2.5
        run: |
          msbuild .\driver\FICVhid.vcxproj /t:Clean,Build /p:Configuration=Release /p:Platform=x64 /p:SignMode=Off /m /v:minimal

      - name: Build driver package catalog
        shell: pwsh
        working-directory: fic-viewer-v1.2.5
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = Join-Path $PWD 'package-vhf'
          New-Item -ItemType Directory -Force $pkg | Out-Null

          Copy-Item .\driver\out\FICVhid.sys $pkg -Force
          Copy-Item .\driver\FICVhid.inf $pkg -Force

          $inf2cat = Get-ChildItem .\packages -Recurse -File -Filter Inf2Cat.exe | Select-Object -First 1
          if (-not $inf2cat) { throw 'Inf2Cat.exe not found in restored WDK packages' }

          Write-Host "Inf2Cat: $($inf2cat.FullName)"
          & $inf2cat.FullName /driver:$pkg /os:10_X64 /uselocaltime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          @(
            'FIC Viewer V1.2.5 VHF BUILD-READY package',
            '',
            'Contents: FICVhid.sys + FICVhid.inf + FICVhid.cat.',
            'The catalog is intentionally unsigned.',
            'Run the separate FIC_Viewer_V1.2.5_FINALIZE_TEST_DRIVER.ps1 on the signing PC.',
            'No private key is stored in this package.',
            '',
            'After catalog signing, install only on a Windows test machine with Test Mode enabled.',
            'Production deployment requires Microsoft driver signing.'
          ) | Set-Content -Encoding UTF8 (Join-Path $pkg 'BUILD-READY-README.txt')

          Get-FileHash (Join-Path $pkg 'FICVhid.sys') -Algorithm SHA256 |
            ForEach-Object { "FICVhid.sys SHA256=$($_.Hash)" } |
            Set-Content -Encoding ASCII (Join-Path $pkg 'SHA256.txt')
          Get-FileHash (Join-Path $pkg 'FICVhid.inf') -Algorithm SHA256 |
            ForEach-Object { "FICVhid.inf SHA256=$($_.Hash)" } |
            Add-Content -Encoding ASCII (Join-Path $pkg 'SHA256.txt')
          Get-FileHash (Join-Path $pkg 'FICVhid.cat') -Algorithm SHA256 |
            ForEach-Object { "FICVhid.cat SHA256=$($_.Hash)" } |
            Add-Content -Encoding ASCII (Join-Path $pkg 'SHA256.txt')

          Get-ChildItem $pkg | Select-Object Name,Length

      - name: Upload build-ready driver package
        uses: actions/upload-artifact@v4
        with:
          name: FIC_Viewer_V1.2.5_SECUREINPUT_BUILD_READY
          path: fic-viewer-v1.2.5/package-vhf
          if-no-files-found: error

      - name: Upload finalize signing script
        uses: actions/upload-artifact@v4
        with:
          name: FIC_Viewer_V1.2.5_FINALIZE_TEST_DRIVER
          path: fic-viewer-v1.2.5/FIC_Viewer_V1.2.5_FINALIZE_TEST_DRIVER.ps1
          if-no-files-found: error
