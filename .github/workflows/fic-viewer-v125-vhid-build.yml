name: FIC Viewer V1.2.5 UMDF HID Build

on:
  push:
    branches:
      - fic-viewer-v1.2.5-build
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Clone Microsoft driver samples
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/Windows-driver-samples.git driver-samples

      - name: Restore official WDK NuGet packages
        shell: pwsh
        working-directory: driver-samples
        run: |
          nuget restore .\packages.config -PackagesDirectory .\packages

      - name: Build official UMDF2 virtual HID sample x64
        shell: pwsh
        run: |
          $stamp = Get-ChildItem .\driver-samples\packages -Recurse -File -Filter stampinf.exe | Select-Object -First 1
          if (-not $stamp) { throw "stampinf.exe not found in restored WDK" }
          $env:Path = "$($stamp.Directory.FullName);$env:Path"
          Write-Host "Using WDK tools from $($stamp.Directory.FullName)"
          msbuild .\driver-samples\hid\vhidmini2\driver\umdf2\VhidminiUm.vcxproj /t:Clean,Build /p:Configuration=Release /p:Platform=x64 /m /v:minimal

      - name: Collect UMDF outputs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Get-ChildItem .\driver-samples\hid\vhidmini2 -Recurse -File |
            Where-Object { $_.Name -match '^VhidminiUm\.(dll|inf|cat|pdb)$' } |
            Copy-Item -Destination artifact -Force
          Get-ChildItem artifact -ErrorAction SilentlyContinue

      - name: Upload UMDF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fic-v125-vhid-umdf-probe
          path: artifact
          if-no-files-found: warn
