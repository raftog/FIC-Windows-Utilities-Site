name: FIC Viewer V1.2.5 VHF Driver Build

on:
  push:
    branches: [ fic-viewer-v1.2.5-build ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Restore WDK NuGet packages
        shell: pwsh
        working-directory: fic-viewer-v1.2.5
        run: |
          nuget restore .\packages.config -PackagesDirectory .\packages

      - name: Build FIC virtual HID driver
        shell: pwsh
        working-directory: fic-viewer-v1.2.5
        run: |
          msbuild .\driver\FICVhid.vcxproj /t:Clean,Build /p:Configuration=Release /p:Platform=x64 /m /v:minimal

      - name: Collect outputs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Get-ChildItem .\fic-viewer-v1.2.5 -Recurse -File -Include FICVhid.sys,FICVhid.inf,FICVhid.cat,FICVhid.pdb |
            Copy-Item -Destination artifact -Force
          Get-ChildItem artifact -ErrorAction SilentlyContinue

      - name: Upload driver artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fic-viewer-v1.2.5-vhid
          path: artifact
          if-no-files-found: warn
