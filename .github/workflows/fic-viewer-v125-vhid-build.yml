name: FIC Viewer V1.2.5 UMDF HID Build

on:
  push:
    branches:
      - fic-viewer-v1.2.5-build
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore WDK NuGet packages
        shell: pwsh
        working-directory: fic-viewer-v1.2.5
        run: |
          nuget restore .\packages.config -PackagesDirectory .\packages

      - name: Build FIC UMDF2 virtual HID DLL x64
        shell: pwsh
        working-directory: fic-viewer-v1.2.5
        run: |
          msbuild .\umdf\FICVhidUm.vcxproj /t:Clean,Build /p:Configuration=Release /p:Platform=x64 /p:SignMode=Off /m /v:minimal

      - name: Build and sign driver package
        shell: pwsh
        working-directory: fic-viewer-v1.2.5
        run: |
          $pkg = Join-Path $PWD 'package'
          New-Item -ItemType Directory -Force $pkg | Out-Null
          Copy-Item .\umdf\out\FICVhidUm.dll $pkg -Force
          Copy-Item .\umdf\FICVhidUm.inf $pkg -Force
          Copy-Item .\umdf\MS-PL-NOTICE.txt $pkg -Force
          $srcDir = Join-Path $pkg 'source'
          New-Item -ItemType Directory -Force $srcDir | Out-Null
          Copy-Item .\umdf\FICVhidUm.c $srcDir -Force
          Copy-Item .\umdf\FICVhidUm.h $srcDir -Force
          Copy-Item .\umdf\FICVhidCommon.h $srcDir -Force
          Copy-Item .\umdf\util.c $srcDir -Force
          Copy-Item .\umdf\FICVhidUm.inf (Join-Path $srcDir 'FICVhidUm.inf.txt') -Force
          Copy-Item .\umdf\FICVhidUm.vcxproj $srcDir -Force
          Copy-Item .\umdf\MS-PL-NOTICE.txt $srcDir -Force

          $inf2cat = Get-ChildItem .\packages -Recurse -File -Filter Inf2Cat.exe | Select-Object -First 1
          if (-not $inf2cat) { throw 'Inf2Cat.exe not found in restored WDK packages' }

          & $inf2cat.FullName /driver:$pkg /os:10_X64 /uselocaltime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=FIC Viewer Virtual HID Driver Signing' -FriendlyName 'FIC Viewer Virtual HID Driver Signing' -CertStoreLocation 'Cert:\CurrentUser\My' -KeyExportPolicy NonExportable -NotAfter (Get-Date).AddYears(10)
          $cerPath = Join-Path $pkg 'FICVhid-DriverSigning.cer'
          Export-Certificate -Cert $cert -FilePath $cerPath | Out-Null

          $signtool = Get-ChildItem .\packages -Recurse -File -Filter signtool.exe | Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
          if (-not $signtool) { $signtool = Get-ChildItem .\packages -Recurse -File -Filter signtool.exe | Select-Object -First 1 }
          if (-not $signtool) { throw 'signtool.exe not found in restored WDK packages' }

          $cat = Get-ChildItem $pkg -File -Filter *.cat | Select-Object -First 1
          if (-not $cat) { throw 'Catalog was not generated' }

          & $signtool.FullName sign /fd SHA256 /sha1 $cert.Thumbprint /s My $cat.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Get-ChildItem $pkg | Select-Object Name,Length
          Get-FileHash (Join-Path $pkg 'FICVhidUm.dll') -Algorithm SHA256
          Get-FileHash $cat.FullName -Algorithm SHA256
          Write-Host "Driver catalog signer thumbprint: $($cert.Thumbprint)"

      - name: Upload UMDF package
        uses: actions/upload-artifact@v4
        with:
          name: fic-viewer-v1.2.5-umdf-hid
          path: fic-viewer-v1.2.5/package
          if-no-files-found: error
